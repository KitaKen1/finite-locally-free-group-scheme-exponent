name: Lean verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up the Comparator sandbox
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor bubblewrap
          sandbox=$(command -v bwrap)
          probe=(--ro-bind / / --dev /dev --proc /proc --unshare-all -- /usr/bin/true)
          if ! "$sandbox" "${probe[@]}"; then
            sudo install -m 0755 "$sandbox" /usr/local/bin/exponent-bwrap
            sandbox=/usr/local/bin/exponent-bwrap
            sudo apparmor_parser -r <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile exponent-bwrap /usr/local/bin/exponent-bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
            "$sandbox" "${probe[@]}"
          fi
          echo "COMPARATOR_BWRAP=$sandbox" >> "$GITHUB_ENV"
      - name: Install elan
        run: |
          installer="$RUNNER_TEMP/elan-init.sh"
          curl --proto '=https' --tlsv1.2 -fsSL https://elan.lean-lang.org/elan-init.sh -o "$installer"
          sh "$installer" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned Mathlib cache
        run: lake exe cache get Mathlib
      - name: Check statements and compare kernels
        run: python3 verification/verify.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lean-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/results/
          retention-days: 90
          if-no-files-found: ignore
